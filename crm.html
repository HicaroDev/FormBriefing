<body class="text-on-surface antialiased min-h-screen flex flex-col font-body-md text-body-md" style="background: linear-gradient(135deg, #FBF8F3 0%, #F5EFEB 50%, #ECE4DB 100%);">

<div class="flex justify-between items-center w-full px-space-lg max-w-7xl mx-auto h-16">

<span class="w-8 h-8 rounded-lg bg-primary-container text-on-primary flex items-center justify-center font-headline-sm text-headline-sm font-extrabold shadow-sm">HD</span>

<a class="border-b-2 border-primary text-primary pb-1 font-semibold transition-colors duration-150" href="crm.html">Funil de Lead</a>
</nav>
<div class="flex items-center gap-2.5">
<button id="btn-new-lead" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-on-surface text-surface-container-lowest font-label-md text-label-md font-semibold hover:bg-primary-container transition-all duration-150 shadow-sm active:scale-95" type="button">
<span class="material-symbols-outlined text-sm">add</span>
          Novo Lead
        </button>
<a href="index.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-base">arrow_back</span> Voltar
</a>
</div>
</div>
</header>
<main class="flex-1 max-w-7xl w-full mx-auto p-space-lg">
<div class="pb-6 border-b border-outline-variant/70 mb-6">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Funil de Lead &amp; Deal</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-0.5">Arraste os cards entre as colunas para atualizar o estágio do Lead. Converta em Cliente quando o negócio fechar.</p>
</div>
<div id="lead-board" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4 items-start"></div>
</main>

<!-- MODAL: Novo Lead -->
<div id="lead-modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/40 p-4">
<div class="glass-surface rounded-2xl border border-outline-variant p-5 w-full max-w-md">
<div class="flex items-center justify-between mb-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface font-bold">Novo Lead</h2>
<button id="btn-close-lead-modal" type="button" class="p-1 rounded text-on-surface-variant hover:bg-surface-container-high">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<form id="lead-form" class="space-y-3">
<div>
<label class="text-xs font-semibold text-on-surface-variant block mb-1">Nome do contato *</label>
<input id="lead-nome-contato" required="" type="text" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm"/>
</div>
<div>
<label class="text-xs font-semibold text-on-surface-variant block mb-1">Empresa *</label>
<input id="lead-empresa" required="" type="text" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm"/>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="text-xs font-semibold text-on-surface-variant block mb-1">E-mail</label>
<input id="lead-email" type="email" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm"/>
</div>
<div>
<label class="text-xs font-semibold text-on-surface-variant block mb-1">WhatsApp</label>
<input id="lead-whatsapp" type="text" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm"/>
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="text-xs font-semibold text-on-surface-variant block mb-1">Origem</label>
<select id="lead-fonte" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm">
<option value="">—</option>
<option value="Instagram">Instagram</option>
<option value="Indicação">Indicação</option>
<option value="Google">Google</option>
<option value="WhatsApp">WhatsApp</option>
</select>
</div>
<div>
<label class="text-xs font-semibold text-on-surface-variant block mb-1">Valor estimado (R$)</label>
<input id="lead-valor" type="number" min="0" step="0.01" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm"/>
</div>
</div>
<button type="submit" class="w-full py-2.5 mt-2 bg-primary text-on-primary rounded-lg font-label-md text-label-md font-semibold hover:bg-primary-container transition-colors shadow-sm">Criar Lead</button>
</form>
</div>
</div>

<script type="module">
  // Funil de Lead/Deal (CRM) — ver _reversa_forward/002-crm-funil-lead-projeto/.
  // Página "burra": só consome /api/leads, nunca lê store.js diretamente.
  // Admin-only (RF-05) — qualquer 401 redireciona para o login.

  let estagios = [];
  let leads = [];

  async function apiLeads(options = {}) {
    const res = await fetch('/api/leads' + (options.query || ''), {
      method: options.method || 'GET',
      credentials: 'same-origin',
      headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
      body: options.body ? JSON.stringify(options.body) : undefined
    });
    if (res.status === 401) {
      window.location.href = 'login.html';
      return null;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Erro ao consultar Leads.');
    return data;
  }

  function formatMoeda(valor) {
    if (valor === null || valor === undefined) return '';
    return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  }

  function renderBoard() {
    const board = document.getElementById('lead-board');
    board.innerHTML = estagios.map(col => {
      const items = leads.filter(l => l.estagio === col.chave);
      return `
        <div class="lead-col glass-surface rounded-2xl border border-outline-variant p-3 flex flex-col gap-3 min-h-[420px] transition-colors" data-estagio="${col.chave}">
          <div class="flex items-center justify-between px-1">
            <span class="text-sm font-semibold text-on-surface">${col.rotulo}</span>
            <span class="text-[11px] font-mono text-outline">${items.length}</span>
          </div>
          <div class="flex flex-col gap-2.5" data-dropzone="${col.chave}">
            ${items.map(leadCardHtml).join('') || `<p class="text-[11px] text-on-surface-variant text-center py-6">Nenhum lead aqui.</p>`}
          </div>
        </div>
      `;
    }).join('');
    attachDragHandlers();
    attachCardActionHandlers();
  }

  function leadCardHtml(lead) {
    const convertido = !!lead.cliente_id;
    return `
      <div class="lead-card bg-surface-container-lowest rounded-xl border border-outline-variant/70 p-3 shadow-xs cursor-grab active:cursor-grabbing" draggable="true" data-lead-id="${lead.id}">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-semibold text-on-surface truncate">${lead.empresa}</span>
          ${lead.fonte_lead ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-surface-container text-primary">${lead.fonte_lead}</span>` : ''}
        </div>
        <p class="text-[11px] text-on-surface-variant truncate">${lead.nome_contato}</p>
        ${lead.valor_estimado ? `<p class="text-[11px] font-semibold text-on-surface mt-0.5">${formatMoeda(lead.valor_estimado)}</p>` : ''}
        <div class="flex items-center justify-between mt-2 pt-2 border-t border-outline-variant/40">
          <button class="btn-delete-lead p-0.5 rounded text-on-surface-variant hover:text-rose-600" data-lead-id="${lead.id}" title="Excluir Lead" type="button">
            <span class="material-symbols-outlined text-sm">delete</span>
          </button>
          ${convertido
            ? `<span class="text-[10px] text-emerald-700 font-semibold">Cliente convertido</span>`
            : (col => col && col.terminal
                ? `<button class="btn-convert-lead text-[10px] px-2 py-1 rounded-lg bg-primary text-on-primary font-semibold" data-lead-id="${lead.id}" type="button">Converter em Cliente</button>`
                : '')(estagios.find(e => e.chave === lead.estagio))
          }
        </div>
      </div>
    `;
  }

  function attachDragHandlers() {
    document.querySelectorAll('.lead-card').forEach(card => {
      card.addEventListener('dragstart', (e) => {
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', card.getAttribute('data-lead-id'));
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
    });

    document.querySelectorAll('.lead-col').forEach(col => {
      col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drag-over'); });
      col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
      col.addEventListener('drop', async (e) => {
        e.preventDefault();
        col.classList.remove('drag-over');
        const leadId = e.dataTransfer.getData('text/plain');
        const novoEstagio = col.getAttribute('data-estagio');
        if (!leadId || !novoEstagio) return;
        await apiLeads({ method: 'PATCH', body: { id: leadId, estagio: novoEstagio } });
        await carregarLeads();
      });
    });
  }

  function attachCardActionHandlers() {
    document.querySelectorAll('.btn-delete-lead').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-lead-id');
        if (!confirm('Excluir este Lead definitivamente?')) return;
        await apiLeads({ method: 'DELETE', query: '?id=' + encodeURIComponent(id) });
        await carregarLeads();
      });
    });

    document.querySelectorAll('.btn-convert-lead').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-lead-id');
        try {
          await apiLeads({ method: 'POST', body: { action: 'convert', id } });
          await carregarLeads();
        } catch (err) {
          alert(err.message || 'Não foi possível converter este Lead.');
        }
      });
    });
  }

  async function carregarLeads() {
    const [estagiosResp, leadsResp] = await Promise.all([
      apiLeads({ query: '?meta=estagios' }),
      apiLeads({})
    ]);
    if (!estagiosResp || !leadsResp) return; // 401, já redirecionou
    estagios = estagiosResp.estagios || [];
    leads = leadsResp.leads || [];
    renderBoard();
  }

  function setupModal() {
    const modal = document.getElementById('lead-modal');
    document.getElementById('btn-new-lead').addEventListener('click', () => {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    });
    document.getElementById('btn-close-lead-modal').addEventListener('click', () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });
    document.getElementById('lead-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await apiLeads({
          method: 'POST',
          body: {
            nome_contato: document.getElementById('lead-nome-contato').value,
            empresa: document.getElementById('lead-empresa').value,
            email: document.getElementById('lead-email').value,
            whatsapp: document.getElementById('lead-whatsapp').value,
            fonte_lead: document.getElementById('lead-fonte').value,
            valor_estimado: document.getElementById('lead-valor').value || null
          }
        });
        e.target.reset();
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        await carregarLeads();
      } catch (err) {
        alert(err.message || 'Não foi possível criar o Lead.');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    setupModal();
    carregarLeads();
  });
</script>
