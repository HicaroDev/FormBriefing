<main class="flex-1 max-w-7xl w-full mx-auto p-space-lg">
<div class="pb-6 border-b border-outline-variant/70 mb-6">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Funil de Vendas &amp; Briefings</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-0.5">Arraste os cards entre as colunas para atualizar o status real do briefing.</p>
</div>
<div id="kanban-board" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start"></div>
</main>
<script type="module">
import { getClients, getBriefingInstances, updateBriefingStatus, patchInstanceRemote } from './store.js';

const COLUMNS = [
  { key: 'enviado', title: 'Enviado / Aguardando', statuses: ['rascunho', 'enviado'], icon: 'send' },
  { key: 'em_preenchimento', title: 'Em Preenchimento', statuses: ['em_preenchimento', 'ajustes_solicitados'], icon: 'edit_note' },
  { key: 'em_revisao', title: 'Em Revisão / Submetido', statuses: ['submetido', 'em_revisao'], icon: 'fact_check' },
  { key: 'aprovado_kickoff', title: 'Kickoff Aprovado', statuses: ['aprovado_kickoff'], icon: 'rocket_launch' }
];

function columnForStatus(status) {
  return COLUMNS.find(c => c.statuses.includes(status)) || COLUMNS[0];
}

function render() {
  const board = document.getElementById('kanban-board');
  const instances = getBriefingInstances();
  const clients = getClients();
  const clientsMap = new Map(clients.map(c => [c.id, c]));

  board.innerHTML = COLUMNS.map(col => {
    const items = instances.filter(i => columnForStatus(i.status).key === col.key);
    return `
      <div class="kanban-col glass-surface rounded-2xl border border-outline-variant p-3 flex flex-col gap-3 min-h-[400px] transition-colors" data-column="${col.key}">
        <div class="flex items-center justify-between px-1">
          <span class="flex items-center gap-1.5 text-sm font-semibold text-on-surface">
            <span class="material-symbols-outlined text-base text-primary">${col.icon}</span> ${col.title}
          </span>
          <span class="text-[11px] font-mono text-outline">${items.length}</span>
        </div>
        <div class="flex flex-col gap-2.5" data-dropzone="${col.key}">
          ${items.map(inst => {
            const client = clientsMap.get(inst.cliente_id) || { empresa: 'Cliente', codigo_unico: 'CLI-0000' };
            const urgent = inst.urgencia === 'high';
            return `
              <div class="kanban-card bg-surface-container-lowest rounded-xl border border-outline-variant/70 p-3 shadow-xs cursor-grab active:cursor-grabbing" draggable="true" data-instance-id="${inst.id}">
                <div class="flex items-center justify-between mb-1">
                  <span class="text-xs font-semibold text-on-surface truncate">${client.empresa}</span>
                  ${urgent ? '<span class="w-1.5 h-1.5 rounded-full bg-rose-500 shrink-0"></span>' : ''}
                </div>
                <p class="text-[11px] text-on-surface-variant truncate">${inst.etapa_nome || 'Briefing'}</p>
                <div class="flex items-center justify-between mt-2 pt-2 border-t border-outline-variant/40">
                  <span class="text-[10px] text-outline font-mono">${client.codigo_unico}</span>
                  <span class="text-[10px] text-outline">${inst.id}</span>
                </div>
              </div>
            `;
          }).join('') || `<p class="text-[11px] text-on-surface-variant text-center py-6">Nenhum briefing aqui.</p>`}
        </div>
      </div>
    `;
  }).join('');

  attachDragHandlers();
}

function attachDragHandlers() {
  document.querySelectorAll('.kanban-card').forEach(card => {
    card.addEventListener('dragstart', (e) => {
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.getAttribute('data-instance-id'));
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });

  document.querySelectorAll('.kanban-col').forEach(col => {
    col.addEventListener('dragover', (e) => {
      e.preventDefault();
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const instanceId = e.dataTransfer.getData('text/plain');
      const columnKey = col.getAttribute('data-column');
      const targetColumn = COLUMNS.find(c => c.key === columnKey);
      if (!instanceId || !targetColumn) return;
      const newStatus = targetColumn.statuses[0];
      updateBriefingStatus(instanceId, newStatus);
      patchInstanceRemote({ id: instanceId, status: newStatus });
      render();
    });
  });
}

document.addEventListener('DOMContentLoaded', render);
</script>
