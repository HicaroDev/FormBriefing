<body class="text-on-surface antialiased min-h-screen flex flex-col font-body-md text-body-md" style="background: linear-gradient(135deg, #FBF8F3 0%, #F5EFEB 50%, #ECE4DB 100%);">
<header class="glass-surface border-b border-outline-variant sticky top-0 z-30 w-full">
<div class="flex justify-between items-center w-full px-space-lg max-w-7xl mx-auto h-16">
<div class="flex items-center gap-2">
<span class="w-8 h-8 rounded-lg bg-primary-container text-on-primary flex items-center justify-center font-headline-sm text-headline-sm font-extrabold shadow-sm">HD</span>
<span class="font-headline-sm text-headline-sm text-on-surface font-extrabold tracking-tight">Studio Suite 2.0</span>
</div>
<a href="projects.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-base">arrow_back</span> Voltar para Projetos
</a>
</div>
</header>
<main class="flex-1 max-w-4xl w-full mx-auto p-space-lg" id="main-content">
<p class="text-sm text-on-surface-variant">Carregando...</p>
</main>

<script type="module">
  // Detalhe de um Projeto real — ver _reversa_forward/003-projeto-cadastro-mvp/.
  // Substitui o mockup estático anterior (cliente fictício fixo "Lumina Movement").

  const params = new URLSearchParams(window.location.search);
  const projetoId = params.get('id');

  async function apiCall(path, options = {}) {
    const res = await fetch(path, {
      method: options.method || 'GET',
      credentials: 'same-origin',
      headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
      body: options.body ? JSON.stringify(options.body) : undefined
    });
    if (res.status === 401) {
      window.location.href = 'login.html';
      return null;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Erro ao consultar o Projeto.');
    return data;
  }

  function formatMoeda(valor) {
    if (valor === null || valor === undefined) return '—';
    return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  }

  let fases = [];
  let projeto = null;

  function render() {
    const main = document.getElementById('main-content');
    const cliente = window.__cliente || {};
    const pct = projeto.allocated_hours > 0
      ? Math.min(100, Math.round((projeto.consumed_hours / projeto.allocated_hours) * 100))
      : 0;

    main.innerHTML = `
      <div class="pb-6 border-b border-outline-variant/70 mb-6">
        <h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">${projeto.nome}</h1>
        <p class="font-body-md text-body-md text-on-surface-variant mt-0.5">${cliente.empresa || projeto.cliente_id} • ${cliente.codigo_unico || ''}</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="glass-surface rounded-2xl border border-outline-variant p-5">
          <h2 class="font-headline-sm text-headline-sm text-on-surface font-bold mb-3">Fase</h2>
          <select id="projeto-fase-select" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm">
            ${fases.map(f => `<option value="${f.chave}" ${f.chave === projeto.fase ? 'selected' : ''}>${f.rotulo}</option>`).join('')}
          </select>
        </div>

        <div class="glass-surface rounded-2xl border border-outline-variant p-5">
          <h2 class="font-headline-sm text-headline-sm text-on-surface font-bold mb-3">Valor Contratado</h2>
          <p class="text-xl font-bold text-on-surface">${formatMoeda(projeto.contracted_value)}</p>
        </div>

        <div class="glass-surface rounded-2xl border border-outline-variant p-5 md:col-span-2">
          <h2 class="font-headline-sm text-headline-sm text-on-surface font-bold mb-3">Horas: Planejado x Realizado</h2>
          <div class="w-full h-3 bg-surface-container rounded-full overflow-hidden mb-2">
            <div class="h-full bg-primary rounded-full" style="width: ${pct}%"></div>
          </div>
          <p class="text-sm text-on-surface-variant mb-4">${projeto.consumed_hours}h consumidas de ${projeto.allocated_hours}h alocadas (${pct}%)</p>
          <form id="apontar-horas-form" class="flex items-end gap-3">
            <div class="flex-1">
              <label class="text-xs font-semibold text-on-surface-variant block mb-1">Apontar horas consumidas</label>
              <input id="horas-input" type="number" min="0.5" step="0.5" required="" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm"/>
            </div>
            <button type="submit" class="py-2 px-4 bg-primary text-on-primary rounded-lg font-label-md text-label-md font-semibold hover:bg-primary-container transition-colors shadow-sm">Apontar</button>
          </form>
        </div>

        <div class="glass-surface rounded-2xl border border-outline-variant p-5 md:col-span-2">
          <h2 class="font-headline-sm text-headline-sm text-on-surface font-bold mb-3">Cliente</h2>
          <p class="text-sm text-on-surface"><strong>${cliente.empresa || '—'}</strong></p>
          <p class="text-sm text-on-surface-variant">${cliente.nome_responsavel || ''} ${cliente.email ? '• ' + cliente.email : ''} ${cliente.whatsapp ? '• ' + cliente.whatsapp : ''}</p>
        </div>
      </div>
    `;

    document.getElementById('projeto-fase-select').addEventListener('change', async (e) => {
      await apiCall('/api/projetos', { method: 'PATCH', body: { id: projetoId, fase: e.target.value } });
      await carregar();
    });

    document.getElementById('apontar-horas-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const horas = document.getElementById('horas-input').value;
      try {
        await apiCall('/api/projetos', { method: 'POST', body: { action: 'apontar_horas', id: projetoId, horas } });
        await carregar();
      } catch (err) {
        alert(err.message || 'Não foi possível apontar as horas.');
      }
    });
  }

  async function carregar() {
    if (!projetoId) {
      document.getElementById('main-content').innerHTML = '<p class="text-sm text-error">Nenhum projeto informado na URL (esperado ?id=...).</p>';
      return;
    }

    const [fasesResp, projetoResp] = await Promise.all([
      apiCall('/api/projetos?meta=fases'),
      apiCall('/api/projetos?id=' + encodeURIComponent(projetoId))
    ]);
    if (!fasesResp || !projetoResp) return; // 401, já redirecionou

    fases = fasesResp.fases || [];
    projeto = projetoResp.projeto;

    if (!projeto) {
      document.getElementById('main-content').innerHTML = '<p class="text-sm text-error">Projeto não encontrado.</p>';
      return;
    }

    const clienteResp = await apiCall('/api/clients?id=' + encodeURIComponent(projeto.cliente_id));
    window.__cliente = clienteResp ? clienteResp.client : null;

    render();
  }

  document.addEventListener('DOMContentLoaded', carregar);
</script>
</body></html>
