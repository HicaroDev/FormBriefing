<style>

<body class="text-on-surface antialiased min-h-screen flex flex-col font-body-md text-body-md" style="background: linear-gradient(135deg, #FBF8F3 0%, #F5EFEB 50%, #ECE4DB 100%);">
<header class="glass-surface border-b border-outline-variant sticky top-0 z-30 w-full">
<div class="flex justify-between items-center w-full px-space-lg max-w-7xl mx-auto h-16">
<div class="flex items-center gap-2">
<span class="w-8 h-8 rounded-lg bg-primary-container text-on-primary flex items-center justify-center font-headline-sm text-headline-sm font-extrabold shadow-sm">HD</span>
<span class="font-headline-sm text-headline-sm text-on-surface font-extrabold tracking-tight">Studio Suite 2.0</span>
</div>
<nav class="hidden md:flex items-center gap-6 text-label-md font-label-md">
<a class="text-on-surface-variant hover:text-primary pb-1 transition-colors duration-150" href="index.html">Dashboard</a>
<a class="text-on-surface-variant hover:text-primary pb-1 transition-colors duration-150" href="crm.html">Funil de Lead</a>
<a class="border-b-2 border-primary text-primary pb-1 font-semibold transition-colors duration-150" href="projects.html">Projetos</a>
</nav>
<div class="flex items-center gap-2.5">
<button id="btn-new-projeto" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-on-surface text-surface-container-lowest font-label-md text-label-md font-semibold hover:bg-primary-container transition-all duration-150 shadow-sm active:scale-95" type="button">
<span class="material-symbols-outlined text-sm">add</span>
          Novo Projeto
        </button>
<a href="index.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-base">arrow_back</span> Voltar
</a>
</div>
</div>
</header>
<main class="flex-1 max-w-7xl w-full mx-auto p-space-lg">
<div class="pb-6 border-b border-outline-variant/70 mb-6">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Projetos</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-0.5">Arraste os cards entre as fases. Abra um projeto para apontar horas e ver detalhes.</p>
</div>
<div id="projeto-board" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4 items-start"></div>
</main>

<!-- MODAL: Novo Projeto -->
<div id="projeto-modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/40 p-4">
<div class="glass-surface rounded-2xl border border-outline-variant p-5 w-full max-w-md">
<div class="flex items-center justify-between mb-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface font-bold">Novo Projeto</h2>
<button id="btn-close-projeto-modal" type="button" class="p-1 rounded text-on-surface-variant hover:bg-surface-container-high">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<form id="projeto-form" class="space-y-3">
<div>
<label class="text-xs font-semibold text-on-surface-variant block mb-1">Cliente *</label>
<select id="projeto-cliente" required="" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm">
<option value="">Selecione...</option>
</select>
</div>
<div>
<label class="text-xs font-semibold text-on-surface-variant block mb-1">Nome do projeto *</label>
<input id="projeto-nome" required="" type="text" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm"/>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="text-xs font-semibold text-on-surface-variant block mb-1">Valor contratado (R$)</label>
<input id="projeto-valor" type="number" min="0" step="0.01" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm"/>
</div>
<div>
<label class="text-xs font-semibold text-on-surface-variant block mb-1">Horas alocadas</label>
<input id="projeto-horas-alocadas" type="number" min="0" step="0.5" class="w-full px-3 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm"/>
</div>
</div>
<button type="submit" class="w-full py-2.5 mt-2 bg-primary text-on-primary rounded-lg font-label-md text-label-md font-semibold hover:bg-primary-container transition-colors shadow-sm">Criar Projeto</button>
</form>
</div>
</div>

<script type="module">
  // Cadastro de Projeto (MVP) — ver _reversa_forward/003-projeto-cadastro-mvp/.
  // Página "burra": só consome /api/projetos e /api/clients. Admin-only (RF-05).

  let fases = [];
  let projetos = [];
  let clientesMap = new Map();

  async function apiCall(path, options = {}) {
    const res = await fetch(path, {
      method: options.method || 'GET',
      credentials: 'same-origin',
      headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
      body: options.body ? JSON.stringify(options.body) : undefined
    });
    if (res.status === 401) {
      window.location.href = 'login.html';
      return null;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Erro ao consultar Projetos.');
    return data;
  }

  function formatMoeda(valor) {
    if (valor === null || valor === undefined) return '—';
    return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  }

  async function carregarClientes() {
    const data = await apiCall('/api/clients');
    if (!data) return;
    const clients = data.clients || [];
    clientesMap = new Map(clients.map(c => [c.id, c]));
    const select = document.getElementById('projeto-cliente');
    select.innerHTML = '<option value="">Selecione...</option>' +
      clients.map(c => `<option value="${c.id}">${c.empresa} (${c.codigo_unico})</option>`).join('');
  }

  function projetoCardHtml(projeto) {
    const cliente = clientesMap.get(projeto.cliente_id);
    const pct = projeto.allocated_hours > 0
      ? Math.min(100, Math.round((projeto.consumed_hours / projeto.allocated_hours) * 100))
      : 0;
    return `
      <a class="proj-card block bg-surface-container-lowest rounded-xl border border-outline-variant/70 p-3 shadow-xs cursor-grab active:cursor-grabbing" draggable="true" data-projeto-id="${projeto.id}" href="project-detail.html?id=${projeto.id}">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-semibold text-on-surface truncate">${projeto.nome}</span>
        </div>
        <p class="text-[11px] text-on-surface-variant truncate">${cliente ? cliente.empresa : projeto.cliente_id}</p>
        ${projeto.contracted_value ? `<p class="text-[11px] font-semibold text-on-surface mt-0.5">${formatMoeda(projeto.contracted_value)}</p>` : ''}
        ${projeto.allocated_hours > 0 ? `
          <div class="mt-2">
            <div class="w-full h-1.5 bg-surface-container rounded-full overflow-hidden">
              <div class="h-full bg-primary rounded-full" style="width: ${pct}%"></div>
            </div>
            <p class="text-[10px] text-outline mt-0.5">${projeto.consumed_hours}h / ${projeto.allocated_hours}h</p>
          </div>
        ` : ''}
      </a>
    `;
  }

  function renderBoard() {
    const board = document.getElementById('projeto-board');
    board.innerHTML = fases.map(fase => {
      const items = projetos.filter(p => p.fase === fase.chave);
      return `
        <div class="proj-col glass-surface rounded-2xl border border-outline-variant p-3 flex flex-col gap-3 min-h-[420px] transition-colors" data-fase="${fase.chave}">
          <div class="flex items-center justify-between px-1">
            <span class="text-sm font-semibold text-on-surface">${fase.rotulo}</span>
            <span class="text-[11px] font-mono text-outline">${items.length}</span>
          </div>
          <div class="flex flex-col gap-2.5" data-dropzone="${fase.chave}">
            ${items.map(projetoCardHtml).join('') || `<p class="text-[11px] text-on-surface-variant text-center py-6">Nenhum projeto aqui.</p>`}
          </div>
        </div>
      `;
    }).join('');
    attachDragHandlers();
  }

  function attachDragHandlers() {
    document.querySelectorAll('.proj-card').forEach(card => {
      card.addEventListener('dragstart', (e) => {
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', card.getAttribute('data-projeto-id'));
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      // Impede que o drag concorra com a navegação do <a> (drop já navega via href no clique normal).
      card.addEventListener('click', (e) => { if (card.classList.contains('dragging')) e.preventDefault(); });
    });

    document.querySelectorAll('.proj-col').forEach(col => {
      col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drag-over'); });
      col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
      col.addEventListener('drop', async (e) => {
        e.preventDefault();
        col.classList.remove('drag-over');
        const projetoId = e.dataTransfer.getData('text/plain');
        const novaFase = col.getAttribute('data-fase');
        if (!projetoId || !novaFase) return;
        await apiCall('/api/projetos', { method: 'PATCH', body: { id: projetoId, fase: novaFase } });
        await carregarProjetos();
      });
    });
  }

  async function carregarProjetos() {
    const [fasesResp, projetosResp] = await Promise.all([
      apiCall('/api/projetos?meta=fases'),
      apiCall('/api/projetos')
    ]);
    if (!fasesResp || !projetosResp) return; // 401, já redirecionou
    fases = fasesResp.fases || [];
    projetos = projetosResp.projetos || [];
    renderBoard();
  }

  function setupModal() {
    const modal = document.getElementById('projeto-modal');
    document.getElementById('btn-new-projeto').addEventListener('click', () => {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    });
    document.getElementById('btn-close-projeto-modal').addEventListener('click', () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });
    document.getElementById('projeto-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await apiCall('/api/projetos', {
          method: 'POST',
          body: {
            cliente_id: document.getElementById('projeto-cliente').value,
            nome: document.getElementById('projeto-nome').value,
            contracted_value: document.getElementById('projeto-valor').value || null,
            allocated_hours: document.getElementById('projeto-horas-alocadas').value || 0
          }
        });
        e.target.reset();
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        await carregarProjetos();
      } catch (err) {
        alert(err.message || 'Não foi possível criar o Projeto.');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', async () => {
    setupModal();
    await carregarClientes();
    await carregarProjetos();
  });
</script>
</body></html>
