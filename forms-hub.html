<main class="flex-1 max-w-7xl w-full mx-auto p-space-lg">
<div class="pb-6 border-b border-outline-variant/70 mb-6">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Forms Hub — Biblioteca de Modelos</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-0.5">Todos os templates de briefing disponíveis para disparo, por vertical.</p>
</div>
<div id="templates-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
</main>
<script type="module">
import { getTemplates } from './store.js';

const VERTICAL_META = {
  pilates: { nome: 'Pilates & Bem-Estar', icon: 'spa', cor: 'text-primary' },
  physio: { nome: 'Fisioterapia & Reabilitação', icon: 'medical_services', cor: 'text-primary-container' },
  fisio_pilates: { nome: 'Fisio & Pilates', icon: 'medical_services', cor: 'text-primary-container' },
  events: { nome: 'Eventos', icon: 'celebration', cor: 'text-tertiary' },
  universal: { nome: 'Universal / Corporativo', icon: 'business_center', cor: 'text-secondary' }
};

function templateLabel(tpl) {
  const titulo = tpl.titulo;
  if (typeof titulo === 'string') return titulo;
  if (titulo && typeof titulo === 'object') return titulo.pt || titulo.it || titulo.en || tpl.id;
  return tpl.id;
}

function render() {
  const grid = document.getElementById('templates-grid');
  const templates = getTemplates();
  if (templates.length === 0) {
    grid.innerHTML = `<p class="text-sm text-on-surface-variant col-span-full">Nenhum modelo cadastrado ainda.</p>`;
    return;
  }
  grid.innerHTML = templates.map(tpl => {
    const meta = VERTICAL_META[tpl.vertical] || { nome: tpl.vertical || 'Geral', icon: 'description', cor: 'text-secondary' };
    const numSecoes = (tpl.secoes || []).length;
    const numCampos = (tpl.secoes || []).reduce((acc, s) => acc + (s.campos || []).length, 0);
    return `
      <div class="glass-surface rounded-2xl border border-outline-variant p-5 flex flex-col gap-3 hover:border-primary/40 transition-colors">
        <div class="flex items-center justify-between">
          <span class="inline-flex items-center gap-1.5 text-xs font-semibold ${meta.cor}">
            <span class="material-symbols-outlined text-base">${meta.icon}</span> ${meta.nome}
          </span>
          <span class="text-[11px] text-outline font-mono">v${tpl.versao || 1}</span>
        </div>
        <h3 class="font-headline-sm text-headline-sm text-on-surface font-semibold leading-snug">${templateLabel(tpl)}</h3>
        <div class="flex items-center gap-3 text-[11px] text-on-surface-variant pt-2 border-t border-outline-variant/50">
          <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">view_agenda</span> ${numSecoes} seções</span>
          <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">list_alt</span> ${numCampos} campos</span>
        </div>
      </div>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', render);
</script>
